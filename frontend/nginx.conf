server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 21m;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/agent/ {
    proxy_pass http://${AGENT_API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
  }

  location /api/ {
    # Docker Desktop publishes both IPv4 and IPv6 host records on Windows,
    # while the host services currently listen on IPv4. Resolve dynamically
    # with IPv6 disabled to avoid a failed IPv6 attempt before each request.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $gateway_host host.docker.internal;
    proxy_pass http://$gateway_host:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
